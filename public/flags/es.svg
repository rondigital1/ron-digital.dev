<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Flag of Spain">

  <!-- Stripes (red:yellow:red = 1:2:1) -->
  <rect width="900" height="600" fill="#C60B1E"/>
  <rect y="150" width="900" height="300" fill="#F1BF00"/>

  <!-- Coat of Arms — official position: ~37% from left, vertically centred in yellow stripe -->
  <g transform="translate(340,300)">

    <defs>
      <!-- Heater-shield clip — all quarter artwork is contained here -->
      <clipPath id="es-sh">
        <path d="M-78,-96 L78,-96 L78,31 Q78,70 0,102 Q-78,70 -78,31 Z"/>
      </clipPath>
    </defs>

    <!-- ═══ Left Pillar of Hercules ═══ -->
    <g transform="translate(-116,0)">
      <!-- Crown atop pillar -->
      <g transform="translate(0,-107)">
        <rect x="-14" y="0"  width="28" height="12" rx="1" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
        <rect x="-14" y="-8" width="7"  height="10"        fill="#F1BF00" stroke="#8B6914" stroke-width="1"/>
        <rect x="-4"  y="-11" width="8" height="13"        fill="#F1BF00" stroke="#8B6914" stroke-width="1"/>
        <rect x="7"   y="-8" width="7"  height="10"        fill="#F1BF00" stroke="#8B6914" stroke-width="1"/>
        <circle cx="0" cy="-2" r="3.5" fill="#C60B1E"/>
      </g>
      <!-- Capital -->
      <rect x="-14" y="-91" width="28" height="11" rx="1" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
      <!-- Shaft -->
      <rect x="-10" y="-80" width="20" height="144" fill="#D4A800" stroke="#8B6914" stroke-width="1.5"/>
      <line x1="-4" y1="-78" x2="-4" y2="62" stroke="#8B6914" stroke-width="0.7" opacity="0.35"/>
      <line x1="0"  y1="-78" x2="0"  y2="62" stroke="#8B6914" stroke-width="0.7" opacity="0.35"/>
      <line x1="4"  y1="-78" x2="4"  y2="62" stroke="#8B6914" stroke-width="0.7" opacity="0.35"/>
      <!-- Base -->
      <rect x="-14" y="64" width="28" height="11" rx="1" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
      <!-- PLUS banner -->
      <path d="M-22,12 L22,12 L24,28 L-24,28 Z" fill="#C60B1E" stroke="#8B6914" stroke-width="1"/>
      <text x="0" y="26" font-size="8.5" font-family="serif" font-weight="bold" fill="#F1BF00" text-anchor="middle">PLUS</text>
    </g>

    <!-- ═══ Right Pillar of Hercules ═══ -->
    <g transform="translate(116,0)">
      <!-- Crown atop pillar -->
      <g transform="translate(0,-107)">
        <rect x="-14" y="0"  width="28" height="12" rx="1" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
        <rect x="-14" y="-8" width="7"  height="10"        fill="#F1BF00" stroke="#8B6914" stroke-width="1"/>
        <rect x="-4"  y="-11" width="8" height="13"        fill="#F1BF00" stroke="#8B6914" stroke-width="1"/>
        <rect x="7"   y="-8" width="7"  height="10"        fill="#F1BF00" stroke="#8B6914" stroke-width="1"/>
        <circle cx="0" cy="-2" r="3.5" fill="#C60B1E"/>
      </g>
      <!-- Capital -->
      <rect x="-14" y="-91" width="28" height="11" rx="1" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
      <!-- Shaft -->
      <rect x="-10" y="-80" width="20" height="144" fill="#D4A800" stroke="#8B6914" stroke-width="1.5"/>
      <line x1="-4" y1="-78" x2="-4" y2="62" stroke="#8B6914" stroke-width="0.7" opacity="0.35"/>
      <line x1="0"  y1="-78" x2="0"  y2="62" stroke="#8B6914" stroke-width="0.7" opacity="0.35"/>
      <line x1="4"  y1="-78" x2="4"  y2="62" stroke="#8B6914" stroke-width="0.7" opacity="0.35"/>
      <!-- Base -->
      <rect x="-14" y="64" width="28" height="11" rx="1" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
      <!-- ULTRA banner -->
      <path d="M-24,12 L24,12 L22,28 L-22,28 Z" fill="#C60B1E" stroke="#8B6914" stroke-width="1"/>
      <text x="0" y="26" font-size="8.5" font-family="serif" font-weight="bold" fill="#F1BF00" text-anchor="middle">ULTRA</text>
    </g>

    <!-- ═══ Shield (all content clipped to heater shape) ═══ -->
    <g clip-path="url(#es-sh)">

      <!-- Base fill (Argent) -->
      <rect x="-78" y="-96" width="156" height="210" fill="#F5F5F0"/>

      <!-- Q1 — Castile: Gules (red) field, Or (gold) castle -->
      <rect x="-78" y="-96" width="78" height="96" fill="#C60B1E"/>
      <g fill="#F1BF00">
        <!-- Connecting wall -->
        <rect x="-74" y="-38" width="68" height="24"/>
        <!-- Left tower -->
        <rect x="-74" y="-62" width="19" height="48"/>
        <rect x="-77" y="-76" width="9"  height="17"/>
        <rect x="-66" y="-76" width="9"  height="17"/>
        <!-- Centre tower (tallest) -->
        <rect x="-50" y="-70" width="23" height="56"/>
        <rect x="-55" y="-86" width="9"  height="19"/>
        <rect x="-44" y="-86" width="9"  height="19"/>
        <rect x="-33" y="-86" width="9"  height="19"/>
        <!-- Right tower -->
        <rect x="-22" y="-62" width="19" height="48"/>
        <rect x="-25" y="-76" width="9"  height="17"/>
        <rect x="-14" y="-76" width="9"  height="17"/>
        <!-- Gate -->
        <rect x="-47" y="-24" width="17" height="30" fill="#C60B1E"/>
        <!-- Arrow slits on side towers -->
        <rect x="-70" y="-55" width="8" height="11" fill="#C60B1E"/>
        <rect x="-15" y="-55" width="8" height="11" fill="#C60B1E"/>
      </g>

      <!-- Q2 — León: Argent field (already white), purple lion rampant -->
      <g fill="#722050">
        <!-- Tail arching over body -->
        <path d="M26,-18 Q10,-55 18,-84 Q22,-72 32,-58 Q26,-44 30,-30 Z"/>
        <!-- Hindquarters -->
        <ellipse cx="32" cy="-10" rx="16" ry="20"/>
        <!-- Body -->
        <ellipse cx="47" cy="-36" rx="21" ry="26"/>
        <!-- Mane -->
        <circle cx="60" cy="-66" r="20" fill="#8B2060" opacity="0.8"/>
        <!-- Head -->
        <circle cx="61" cy="-66" r="14"/>
        <!-- Raised right forepaw -->
        <ellipse cx="73" cy="-52" rx="10" ry="7" transform="rotate(-30,73,-52)"/>
        <!-- Claws -->
        <rect x="68" y="-46" width="4" height="9" rx="2" transform="rotate(5,68,-46)"/>
        <rect x="73" y="-45" width="4" height="9" rx="2" transform="rotate(-5,73,-45)"/>
        <!-- Hind legs -->
        <rect x="24" y="4"  width="14" height="28" rx="5"/>
        <rect x="43" y="6"  width="12" height="25" rx="5"/>
        <!-- Tongue -->
        <ellipse cx="69" cy="-57" rx="4" ry="6" fill="#C60B1E"/>
        <!-- Lion's crown (Or) -->
        <rect x="49" y="-88" width="24" height="10" fill="#F1BF00"/>
        <rect x="47" y="-99" width="7"  height="13" fill="#F1BF00"/>
        <rect x="57" y="-101" width="6" height="15" fill="#F1BF00"/>
        <rect x="66" y="-99" width="7"  height="13" fill="#F1BF00"/>
      </g>

      <!-- Q3 — Navarre: Gules field, Or chain grid with emerald centre -->
      <rect x="-78" y="0" width="78" height="115" fill="#C60B1E"/>
      <g stroke="#F1BF00" stroke-width="4.5" fill="none">
        <line x1="-75" y1="23" x2="-4"  y2="23"/>
        <line x1="-75" y1="50" x2="-4"  y2="50"/>
        <line x1="-75" y1="77" x2="-4"  y2="77"/>
        <line x1="-60" y1="7"  x2="-60" y2="102"/>
        <line x1="-38" y1="7"  x2="-38" y2="102"/>
        <line x1="-16" y1="7"  x2="-16" y2="102"/>
      </g>
      <g fill="#F1BF00">
        <circle cx="-60" cy="23" r="7"/>
        <circle cx="-38" cy="23" r="7"/>
        <circle cx="-16" cy="23" r="7"/>
        <circle cx="-60" cy="50" r="7"/>
        <circle cx="-38" cy="50" r="7"/>
        <circle cx="-16" cy="50" r="7"/>
        <circle cx="-60" cy="77" r="7"/>
        <circle cx="-38" cy="77" r="7"/>
        <circle cx="-16" cy="77" r="7"/>
      </g>
      <!-- Emerald at centre intersection -->
      <ellipse cx="-38" cy="50" rx="10" ry="8" fill="#1a7a35"/>

      <!-- Q4 — Aragon: Or field, 4 Gules pallets -->
      <rect x="0"  y="0" width="78"  height="115" fill="#F1BF00"/>
      <rect x="5"  y="0" width="14"  height="115" fill="#C60B1E"/>
      <rect x="26" y="0" width="14"  height="115" fill="#C60B1E"/>
      <rect x="47" y="0" width="14"  height="115" fill="#C60B1E"/>
      <rect x="68" y="0" width="14"  height="115" fill="#C60B1E"/>

      <!-- Internal dividers (drawn over quarters) -->
      <line x1="0"   y1="-96" x2="0"   y2="106" stroke="#1a1a1a" stroke-width="2.5"/>
      <line x1="-78" y1="0"   x2="78"  y2="0"   stroke="#1a1a1a" stroke-width="2.5"/>

      <!-- Granada escutcheon — small shield overlapping bottom centre -->
      <path d="M-21,68 L21,68 L21,88 Q21,104 0,113 Q-21,104 -21,88 Z"
            fill="#F5F5F0" stroke="#1a1a1a" stroke-width="2"/>
      <!-- Pomegranate fruit -->
      <ellipse cx="0" cy="93" rx="12" ry="14" fill="#C60B1E"/>
      <!-- Calyx (green) -->
      <rect x="-7"  y="74" width="14" height="6"  fill="#2a7a30"/>
      <rect x="-10" y="69" width="5"  height="7"  fill="#2a7a30"/>
      <rect x="-2"  y="67" width="4"  height="9"  fill="#2a7a30"/>
      <rect x="5"   y="69" width="5"  height="7"  fill="#2a7a30"/>
      <!-- Seeds (Or) -->
      <circle cx="0"  cy="91" r="3"   fill="#F1BF00"/>
      <circle cx="-5" cy="99" r="2.5" fill="#F1BF00"/>
      <circle cx="5"  cy="99" r="2.5" fill="#F1BF00"/>

    </g>
    <!-- Shield outline drawn on top of clip group for clean edges -->
    <path d="M-78,-96 L78,-96 L78,31 Q78,70 0,102 Q-78,70 -78,31 Z"
          fill="none" stroke="#1a1a1a" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- ═══ Royal Crown (above shield) ═══ -->
    <g transform="translate(0,-117)">
      <!-- Left arch -->
      <path d="M-34,5 Q-24,-27 0,-22" fill="none" stroke="#F1BF00" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M-34,5 Q-24,-27 0,-22" fill="none" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Right arch -->
      <path d="M34,5 Q24,-27 0,-22" fill="none" stroke="#F1BF00" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M34,5 Q24,-27 0,-22" fill="none" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round"/>
      <!-- Orb at crown apex -->
      <circle cx="0" cy="-22" r="7.5" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
      <line x1="-7.5" y1="-22" x2="7.5" y2="-22" stroke="#8B6914" stroke-width="0.9"/>
      <!-- Cross on orb -->
      <rect x="-2.5" y="-38" width="5"  height="18" fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
      <rect x="-8"   y="-31" width="16" height="5"  fill="#F1BF00" stroke="#8B6914" stroke-width="1.2"/>
      <!-- Headband -->
      <rect x="-34" y="5" width="68" height="15" rx="2" fill="#F1BF00" stroke="#8B6914" stroke-width="1.5"/>
      <!-- Gems -->
      <ellipse cx="-24" cy="12" rx="5.5" ry="4.5" fill="#C60B1E"  stroke="#8B6914" stroke-width="0.8"/>
      <ellipse cx="-11" cy="12" rx="4.5" ry="4"   fill="#1a5ca8"  stroke="#8B6914" stroke-width="0.8"/>
      <ellipse cx="0"   cy="12" rx="5.5" ry="4.5" fill="#C60B1E"  stroke="#8B6914" stroke-width="0.8"/>
      <ellipse cx="11"  cy="12" rx="4.5" ry="4"   fill="#1a5ca8"  stroke="#8B6914" stroke-width="0.8"/>
      <ellipse cx="24"  cy="12" rx="5.5" ry="4.5" fill="#C60B1E"  stroke="#8B6914" stroke-width="0.8"/>
      <!-- Pearls at arch ends -->
      <circle cx="-30" cy="2"   r="3" fill="#F0EEE8" stroke="#8B6914" stroke-width="0.8"/>
      <circle cx="30"  cy="2"   r="3" fill="#F0EEE8" stroke="#8B6914" stroke-width="0.8"/>
      <circle cx="-16" cy="-16" r="3" fill="#F0EEE8" stroke="#8B6914" stroke-width="0.8"/>
      <circle cx="16"  cy="-16" r="3" fill="#F0EEE8" stroke="#8B6914" stroke-width="0.8"/>
    </g>

  </g>
</svg>
